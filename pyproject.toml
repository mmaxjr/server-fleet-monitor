[build-system]
requires = ["hatchling>=1.25"]
build-backend = "hatchling.build"

[project]
name = "server-fleet-monitor"
version = "0.1.0"
description = "Dashboard Textual para monitorar servidores Debian por SSH"
requires-python = ">=3.11"
dependencies = [
  "paramiko>=3.4",
  "psutil>=5.9",
  "pydantic>=2.7",
  "PyYAML>=6.0",
  "textual>=0.70",
]

[project.optional-dependencies]
test = ["pytest>=8", "pytest-asyncio>=0.23"]

[project.scripts]
fleet-monitor = "fleet_monitor.app:main"

[tool.hatch.build.targets.wheel]
packages = ["fleet_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
norecursedirs = ["vendor", ".git"]
addopts = "-p no:cacheprovider"
